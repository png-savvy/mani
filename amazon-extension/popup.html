<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; background: #121212; color: #eee; }
      h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
      label { display: block; margin: 8px 0 2px; color: #bbb; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #444; background: #1e1e1e; color: #eee; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; padding: 7px; border-radius: 6px; border: 0; background: #e8b931; color: #111; font-weight: 600; cursor: pointer; }
      button.ghost { background: #2a2a2a; color: #eee; }
      #status { margin-top: 12px; padding: 8px; border-radius: 6px; background: #1e1e1e; white-space: pre-wrap; }
      #status.error { background: #4a1a1a; }
      .muted { color: #999; font-size: 12px; }
      a { color: #e8b931; }
      body.in-tab { width: auto; max-width: 420px; margin: 40px auto; }
    </style>
  </head>
  <body>
    <h1><img src="icon48.png" width="20" height="20" alt="" /> Mani Amazon</h1>
    <label for="url">Mani address</label>
    <input id="url" placeholder="https://your-mani-address" />
    <label for="token">Extension token <span class="muted">(Mani → Settings → Amazon)</span></label>
    <input id="token" type="password" placeholder="mani_amz_…" />
    <label for="days">Look back (days)</label>
    <input id="days" type="number" min="7" max="365" />
    <div class="row">
      <button id="save">Save</button>
      <button id="sync" class="ghost">Sync now</button>
    </div>
    <div id="status">…</div>
    <p class="muted">Checks Amazon every 3 hours while your browser is open. Stay signed in to amazon.com in this browser.</p>
    <p class="muted" id="tab-hint">Closes when you click away? What you type is kept — or <a href="#" id="tab">open these settings in a tab</a>.</p>
    <script src="popup.js"></script>
  </body>
</html>
